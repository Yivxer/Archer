# Archer Configuration
config_version = 2
# Copy this file to archer.toml and fill in your values.
# archer.toml is gitignored — it will never be committed.

[api]
active_profile = "lite"                           # lite | pro | max
base_url     = "https://api.deepseek.com/v1"   # or any OpenAI-compatible endpoint
api_key_ref  = "env:DEEPSEEK_API_KEY"           # or keychain:lite
model        = "deepseek-chat"
model_auto   = true                             # true=每轮按意图选 models[]；/model <名> 锁定后置 false
vision_model = "deepseek-chat"                  # model to use when images are attached
models       = ["deepseek-chat", "deepseek-reasoner"]  # [0]=快聊 [1]=重推理/工具；/model 列表
timeout_s    = 45
max_retries  = 1

[model_profiles.lite]
label        = "DSK"
provider     = "DeepSeek"
base_url     = "https://api.deepseek.com/v1"
api_key_ref  = "env:DEEPSEEK_API_KEY"
model        = "deepseek-chat"
model_auto   = true
vision_model = "deepseek-chat"
models       = ["deepseek-chat", "deepseek-reasoner"]

[model_profiles.pro]
label        = "KIM"
provider     = "Kimi"
base_url     = ""                                # fill after Kimi API approval
api_key_ref  = "keychain:pro"                    # Settings stores the secret in system credentials
model        = ""                                # fill after approval
model_auto   = false
vision_model = ""
models       = []

[model_profiles.max]
label        = "GLM"
provider     = "GLM"
base_url     = ""                                # fill after GLM API approval
api_key_ref  = "keychain:max"                    # Settings stores the secret in system credentials
model        = ""                                # fill after approval
model_auto   = false
vision_model = ""
models       = []

# [api] OpenAI example:
# base_url = "https://api.openai.com/v1"
# api_key  = "sk-..."
# model    = "gpt-4o"

[persona]
name          = "Archer"                        # Archer's display name
soul_path     = "~/.archer/SOUL.md"             # your soul archive (never committed)
memory_path   = "~/.archer/MEMORY.md"           # your current-state snapshot
covenant_path = "~/.archer/COVENANT.md"         # root covenant (never auto-modified)
presence_path = "~/.archer/PRESENCE.md"         # interaction style
default_mode  = "coach"                         # mirror | coach | critic | operator
current_mode  = "coach"                         # updated automatically by /mode
current_expert = "default"                      # default | developer | video-coach | content-creator | counselor | parent-educator

[persona.history]
covenant_dir = "~/.archer/history/covenant/"    # proposed covenant revisions
presence_dir = "~/.archer/history/presence/"    # presence change history

[runtime.migration_modes]
# Runtime Closure domains default to shadow; authoritative requires a passed gate.
task_plan = "shadow"

[runtime.command_migration_modes.background_job.vault_reflection]
# Domain authoritative never bypasses these per-command fail-closed modes.
create = "shadow"
start = "shadow"
retry = "shadow"

[persona.modes.mirror]
name   = "Mirror"
prompt = "Current mode: mirror. Your only job is to ask questions and clarify. No advice."

[persona.modes.coach]
name   = "Coach"
prompt = "Current mode: coach. Drive toward action. End each response by asking: what will you do next?"

[persona.modes.critic]
name   = "Critic"
prompt = "Current mode: critic. Challenge assumptions, find logic gaps and inconsistencies."

[persona.modes.operator]
name   = "Operator"
prompt = "Current mode: operator. Concise responses, complete the task directly, no extra questions."

# Optional: override built-in experts or add custom workbenches.
# Part 6 functional keys (label, note, model_profile, skill_policy, skills,
# prompt_overlay, starters, memory_tags) stay as they are.
# Personality-layer keys are additive. They cannot set covenant_path / soul_path.
