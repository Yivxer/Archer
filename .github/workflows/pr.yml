name: PR Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# 同一 PR 新 push 取消旧 run，省 CI 配额
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 架构测试子集
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run focused tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest \
            tests/test_fastapi_routes.py \
            tests/test_active_context.py \
            tests/test_provider_breaker.py \
            tests/test_simple_path_fork.py \
            tests/test_p0_skill_wrapping.py \
            tests/test_thread_store.py \
            tests/test_ci_workflows.py \
            tests/test_workflow_evals.py \
            tests/test_desktop_contract.py \
            tests/test_journey_smoke_script.py \
            tests/test_architecture_boundaries.py \
            tests/test_api_tool_helpers.py \
            tests/test_job_trace_and_session_concurrency.py \
            tests/test_desktop_api.py::TestDesktopSessions \
            -q --no-header

  ruff-lint:
    name: Ruff Lint（非阻塞，展示 violation 趋势）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . --statistics

  ts-tests:
    name: TypeScript 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/desktop/package-lock.json

      - name: Install dependencies
        working-directory: client/desktop
        run: npm ci

      - name: Run vitest
        working-directory: client/desktop
        run: npm test -- --run

  ts-typecheck:
    name: TypeScript 类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/desktop/package-lock.json

      - name: Install dependencies
        working-directory: client/desktop
        run: npm ci

      # 用 npm run build 替代 tsc --noEmit：build = tsc + vite build，
      # 能同时捕获类型错误和打包错误
      - name: Build (tsc + vite)
        working-directory: client/desktop
        run: npm run build
