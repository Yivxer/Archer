name: Nightly Journey Smoke

on:
  schedule:
    # 每天 04:00 UTC = 北京时间 12:00
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  journey-smoke:
    name: Journey Smoke (8 条核心用户旅程)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ARCHER_DESKTOP_TOKEN: ci-smoke-token
      ARCHER_TOKEN_FILE: ${{ runner.temp }}/archer/desktop-api-token
      ARCHER_API_KEY: ${{ secrets.ARCHER_NIGHTLY_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.ARCHER_NIGHTLY_API_KEY }}
      ARCHER_BASE_URL: https://api.deepseek.com/v1
      ARCHER_MODEL: deepseek-chat
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/desktop/package-lock.json

      - name: Install Desktop dependencies
        working-directory: client/desktop
        run: npm ci

      - name: Build Desktop
        working-directory: client/desktop
        run: npm run build

      - name: Run journey smoke
        run: |
          set -euo pipefail
          if [[ -z "$ARCHER_API_KEY" ]]; then
            echo "Missing required secret: ARCHER_NIGHTLY_API_KEY"
            exit 1
          fi

          mkdir -p "$(dirname "$ARCHER_TOKEN_FILE")"
          printf '%s' "$ARCHER_DESKTOP_TOKEN" > "$ARCHER_TOKEN_FILE"

          python terminal/archer_api.py --port 8765 --token "$ARCHER_DESKTOP_TOKEN" &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8765/health >/dev/null \
              && curl -sf http://127.0.0.1:8765/ready | grep -q '"ready":true'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "Archer API did not become ready"
            exit 1
          fi

          bash scripts/journey_smoke.sh --all

      - name: Collect metrics
        if: always()
        run: |
          python scripts/collect_metrics.py || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-smoke-${{ github.run_id }}
          path: |
            logs/archer_api.log
            logs/journey-smoke.log
            logs/metrics/
          retention-days: 14
