<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>登录 · Archer</title>
  <meta name="description" content="登录或注册你的 Archer 账号。" />
  <link rel="icon" type="image/svg+xml" href="/archer-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/archer-favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/archer-favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('archer-theme');if(t!=='light')document.documentElement.setAttribute('data-theme','dark');})();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #4dd9d4;
      --blue: #1e7be8;
      --bg: #0d1219;
      --surface: rgba(18,30,50,0.72);
      --border: rgba(77,217,212,0.16);
      --text: rgba(232,230,224,0.92);
      --muted: rgba(155,180,198,0.55);
      --error: #f5612a;
    }
    [data-theme="light"] {
      --bg: #f5f2ec;
      --surface: rgba(255,255,255,0.82);
      --border: rgba(30,123,232,0.16);
      --text: rgba(36,49,58,0.92);
      --muted: rgba(89,102,113,0.62);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "PingFang SC", sans-serif;
      font-weight: 300;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    }

    .card {
      width: min(360px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .ring {
      width: 48px;
      height: 48px;
      border-radius: 46% 54% 53% 47% / 48% 52% 44% 56%;
      background: conic-gradient(from 195deg, #5ee8e0, #2aabf0, #1e7be8, #f5c842, #f5612a, #e8212a, #5ee8e0);
      -webkit-mask: radial-gradient(circle at center, transparent 38%, #000 40%);
      mask: radial-gradient(circle at center, transparent 38%, #000 40%);
      filter: drop-shadow(0 0 12px rgba(77,217,212,0.45));
      animation: morph 14s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes morph {
      0%,100% { border-radius: 46% 54% 53% 47% / 48% 52% 44% 56%; }
      33%      { border-radius: 53% 47% 46% 54% / 55% 45% 57% 43%; }
      66%      { border-radius: 47% 53% 57% 43% / 43% 57% 46% 54%; }
    }

    .brand {
      font-family: "Comfortaa", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: linear-gradient(108deg, #4dd9d4 0%, #1e7be8 40%, #f5c842 70%, #f5612a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    h1 {
      font-size: 17px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 20px;
    }
    [data-theme="light"] input[type="email"] {
      background: rgba(255,255,255,0.6);
    }
    input[type="email"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(77,217,212,0.12);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 999px;
      border: none;
      font-family: "Comfortaa", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      background: linear-gradient(135deg, #3aceca, #1876e2 40%, #eebe34 75%, #f05024);
      color: #fff;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .state-sent {
      display: none;
      text-align: center;
      padding: 8px 0;
    }
    .state-sent .check {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .state-sent p {
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }
    .state-sent strong { color: var(--text); }

    .error-msg {
      font-size: 12px;
      color: var(--error);
      margin-top: 8px;
      min-height: 18px;
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="ring"></div>
      <span class="brand">Archer</span>
    </div>

    <div id="formState">
      <h1>登录 / 注册</h1>
      <p class="subtitle">输入邮箱，收到链接后点击即可登录。<br>没有账号会自动注册。</p>

      <label for="emailInput">邮箱</label>
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" />

      <button class="btn" id="submitBtn" type="button">发送登录链接</button>
      <p class="error-msg" id="errorMsg"></p>
    </div>

    <div class="state-sent" id="sentState">
      <div class="check">✉️</div>
      <p>链接已发送至<br><strong id="sentEmail"></strong><br><br>点击邮件中的链接完成登录。</p>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">← 返回首页</a>
    &nbsp;·&nbsp;
    <a href="privacy.html">隐私政策</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://lwtgagkykcilomdfynkj.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_xJiGJ0eERe7WbvCnp_m9ng_7yTkbbzG'
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    const emailInput = document.getElementById('emailInput')
    const submitBtn  = document.getElementById('submitBtn')
    const errorMsg   = document.getElementById('errorMsg')
    const formState  = document.getElementById('formState')
    const sentState  = document.getElementById('sentState')
    const sentEmail  = document.getElementById('sentEmail')

    const returnTo = new URLSearchParams(location.search).get('return_to')
    if (returnTo) {
      let target = `${location.origin}/index.html`
      try {
        const parsed = new URL(returnTo, location.origin)
        if (parsed.origin === location.origin) target = parsed.href
      } catch (_) {}
      localStorage.setItem('archer_auth_return_to', target)
    }

    // Redirect URI: auth.html handles the callback
    const redirectTo = `${location.origin}/auth.html`

    submitBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim()
      if (!email || !email.includes('@')) {
        errorMsg.textContent = '请输入有效的邮箱地址。'
        return
      }
      submitBtn.disabled = true
      submitBtn.textContent = '发送中…'
      errorMsg.textContent = ''

      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: redirectTo }
      })

      if (error) {
        errorMsg.textContent = error.message || '发送失败，请稍后重试。'
        submitBtn.disabled = false
        submitBtn.textContent = '发送登录链接'
        return
      }

      sentEmail.textContent = email
      formState.style.display = 'none'
      sentState.style.display = 'block'
    })

    emailInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitBtn.click()
    })
  </script>
</body>
</html>
