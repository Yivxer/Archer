[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --no-header
markers =
    unit: deterministic pure module or source-policy tests with no external services
    contract: deterministic Python-Desktop JSON, SSE, workflow, or interface contracts
    integration: local API, SQLite, approval, and receipt integration tests
    journey: real-model end-to-end user journeys; nightly only
filterwarnings =
    ignore::DeprecationWarning:swigvarlink
    ignore::DeprecationWarning:SwigPy
