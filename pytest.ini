[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --no-header
markers =
    unit: deterministic pure module or source-policy tests with no external services
    contract: deterministic Python-Desktop JSON, SSE, workflow, or interface contracts
    integration: local API, SQLite, approval, and receipt integration tests
    journey: real-model end-to-end user journeys; nightly only
# ── marker 使用约定 ──────────────────────────────────────────────────────────
# PR CI (.github/workflows/pr.yml): 用文件列表枚举，确定性高，不依赖 marker
# 本地快速验证（跳过慢测试）:
#   pytest -m "not integration"          # 跳过 integration 标记的测试
#   pytest -m "unit or contract"          # 只跑 unit + contract
# 全量测试:
#   pytest                                # 跑所有测试
# 标记约定:
#   - 文件级: 在 import 后加 `pytestmark = pytest.mark.integration`
#   - 函数级: 在 def 上一行加 `@pytest.mark.integration`
#   - 慢测试（≥5s）优先标 integration，避免本地开发循环被拖慢
filterwarnings =
    ignore::DeprecationWarning:swigvarlink
    ignore::DeprecationWarning:SwigPy
